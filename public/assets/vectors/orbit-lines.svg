<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer subtle circular orbit -->
  <circle cx="320" cy="320" r="280" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 4"/>
  <!-- Main tilted elliptical orbital ring -->
  <ellipse cx="320" cy="320" rx="300" ry="170" transform="rotate(-28 320 320)" stroke="#64748B" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- Secondary counter orbit ring -->
  <ellipse cx="320" cy="320" rx="260" ry="210" transform="rotate(35 320 320)" stroke="#64748B" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Orbital Nodes / Dots -->
  <circle cx="120" cy="240" r="3.5" fill="#475569" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="490" cy="410" r="4.5" fill="#475569" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="430" cy="170" r="3" fill="#64748B"/>
  <circle cx="210" cy="460" r="3" fill="#64748B"/>
</svg>
